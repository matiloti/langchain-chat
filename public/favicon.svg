<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- chat bubble body -->
  <path d="M8 12 C8 6, 14 2, 22 2 L42 2 C50 2, 56 6, 56 12 L56 32 C56 38, 50 42, 42 42 L24 42 L14 52 L16 42 L14 42 C10 42, 8 38, 8 34 Z" fill="url(#bg)" stroke="#333" stroke-width="2"/>
  <!-- gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <!-- left eye (looking sideways, derpy) -->
  <circle cx="23" cy="18" r="5" fill="white"/>
  <circle cx="25" cy="17" r="2.5" fill="#333"/>
  <!-- right eye (bigger, goofy) -->
  <circle cx="41" cy="16" r="6" fill="white"/>
  <circle cx="43" cy="15" r="3" fill="#333"/>
  <!-- goofy grin -->
  <path d="M22 28 Q32 38, 44 26" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tongue sticking out -->
  <ellipse cx="36" cy="33" rx="4" ry="3" fill="#f87171"/>
</svg>
